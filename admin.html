<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bio Challenge 관리자 통계</title><style>body{font:16px system-ui,sans-serif;background:#0b1f27;color:#e7f8f3;margin:0;padding:25px}main{max-width:920px;margin:auto}button{padding:12px 18px;border:0;border-radius:10px;background:#58dfb0;font-weight:bold;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{padding:10px;text-align:left;border-bottom:1px solid #43616a}section{background:#15323b;border-radius:16px;padding:20px;margin:18px 0}small{color:#a9c7c1}</style></head><body><main><h1>📊 Bio Challenge 관리자 통계</h1><p id="status">Firebase 연결 중...</p><button id="login">Google 관리자 로그인</button> <button id="load">통계 새로고침</button> <button id="csv">CSV 내려받기</button><section><h2>전체 응시 통계</h2><p id="summary">로그인 후 통계를 불러오세요.</p></section><section><h2>문제별 오답 통계</h2><p><small>오답률 = (오답 + 시간초과) / 해당 문제 응시 횟수</small></p><div id="stats"></div></section><p><small>관리자 UID는 로그인 후 화면에 표시됩니다. Firestore 보안 규칙의 REPLACE_WITH_ADMIN_UID에 붙여넣으세요. 학생에게 관리자 페이지를 공유하지 마세요.</small></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id);let rows=[];let questions=[];fetch('./questions.json').then(r=>r.json()).then(q=>questions=q).catch(()=>{});
if(firebaseConfig.apiKey.startsWith('PASTE_')){$('status').textContent='firebase-config.js 설정을 먼저 완료하세요.';}else{
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
onAuthStateChanged(auth,u=>{$('status').textContent=u?`로그인: ${u.email||'익명'} | 관리자 UID: ${u.uid}`:'Google 관리자 계정으로 로그인하세요.';});
$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());}catch(e){$('status').textContent=e.message;}};
$('load').onclick=async()=>{if(!auth.currentUser){alert('관리자 로그인이 필요합니다.');return;}try{
 const snap=await getDocs(collection(db,'attempts'));rows=snap.docs.map(d=>d.data());
 const stats=Array.from({length:20},(_,id)=>({id,total:0,wrong:0,timeout:0,choice:[0,0,0,0]}));
 let sum=0;for(const r of rows){sum+=r.score||0;for(const a of r.answers||[]){const s=stats[a.id];if(!s)continue;s.total++;if(!a.correct)s.wrong++;if(a.choice===null)s.timeout++;else if(Number.isInteger(a.choice)&&a.choice>=0&&a.choice<4)s.choice[a.choice]++;}}
 $('summary').textContent=`총 응시 ${rows.length}회 · 평균 점수 ${rows.length?Math.round(sum/rows.length).toLocaleString():0}점 · 총 오답 ${stats.reduce((n,s)=>n+s.wrong,0)}개`;
 $('stats').replaceChildren();const table=document.createElement('table');table.innerHTML='<thead><tr><th>문항</th><th>응시</th><th>오답</th><th>오답률</th><th>시간초과</th><th>선택지 1~4 선택 횟수</th></tr></thead>';const body=document.createElement('tbody');stats.sort((a,b)=>(b.total?b.wrong/b.total:0)-(a.total?a.wrong/a.total:0)).forEach(s=>{const tr=document.createElement('tr');[(s.id+1)+'. '+(questions[s.id]?.question||''),s.total,s.wrong,(s.total?(100*s.wrong/s.total).toFixed(1):'0.0')+'%',s.timeout,s.choice.join(' / ')].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});body.append(tr)});table.append(body);$('stats').append(table);$('status').textContent='통계 업데이트 완료';
 }catch(e){$('status').textContent='통계 조회 실패: '+e.message+' (Firestore 규칙의 관리자 UID를 확인하세요)';}};
$('csv').onclick=()=>{if(!rows.length){alert('통계를 먼저 불러오세요.');return;}const data=[['응시번호','닉네임','점수','문항ID','정답여부','선택지번호','풀이시간(ms)']];rows.forEach((r,i)=>(r.answers||[]).forEach(a=>data.push([i+1,r.nickname,r.score,a.id+1,a.correct?'정답':'오답',a.choice===null?'시간초과':a.choice+1,a.elapsedMs])));const csv='\uFEFF'+data.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='biochallenge_answers.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
}
</script></body></html>
